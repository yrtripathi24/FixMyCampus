<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Report submitted - FixMyCampus</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <main class="page-shell confirmation">
        <p class="eyebrow">Report received</p>
        <h1>Thanks for helping improve campus.</h1>
        <p class="intro">Your report has been recorded as a new campus incident.</p>
        <div class="summary-card">
            <p><strong>Incident #{{ incident.id }}</strong></p>
            <p>{{ incident.title }}</p>
            <p>{{ incident.category }} · {{ incident.location }}</p>
        </div>
        <a class="button" href="{{ url_for('main.incidents') }}">View incidents</a>
        <a class="text-link" href="{{ url_for('main.report') }}">Report another problem</a>
    </main>
</body>
</html>
